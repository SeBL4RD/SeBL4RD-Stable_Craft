# StableCraft — configuration.
#
# Tu n'as normalement rien à modifier ici : double-clique sur StableCraft.bat.
# Le lanceur détecte PhotoCraft et ComfyUI, ou lit les chemins ci-dessous.
# Si un chemin obligatoire manque, il affiche un message clair et s'arrête.
#
# Les chemins de modèles sont OPTIONNELS. Si tu ne les renseignes pas,
# StableCraft utilise ce que ComfyUI voit déjà. Aucun modèle n'est téléchargé
# automatiquement.
#
# Données locales : <dossier StableCraft>/user (sessions, token, journaux)
# Modèles téléchargés : <dossier StableCraft>/models
# Rien n'est écrit dans AppData.

[app]
language = "fr"
theme = "dark"
default_profile = "flux3_klein"
# Vide = <dossier StableCraft>/user/sessions
# Doit rester sous photocraft.automation_root.
# sessions_dir = ""
# Python qui lance l'UI (Tkinter). Vide = le Python qui exécute StableCraft.bat.
# python_ui = "C:/Users/Seb/AppData/Local/Programs/Python/Python311/pythonw.exe"

[photocraft]
# Photocraft.exe. Vide = recherche automatique.
executable = ""
control_host = "127.0.0.1"
control_port = 7878
# Vide = <dossier StableCraft>/user/control.token
control_token_file = ""
# Vide = <dossier StableCraft>/user
# Doit être le même dossier que --automation-write-root de PhotoCraft.
automation_root = ""

[comfyui]
endpoint = "http://127.0.0.1:12452"
# Dossier ComfyUI portable (celui qui contient run_nvidia_gpu.bat et python_embeded).
# Vide = recherche automatique.
root = ""
# Lanceur ComfyUI. Vide = <root>/run_nvidia_gpu.bat
start_command = ""
# Python embarqué de ComfyUI (Pillow + requests). Vide = <root>/python_embeded/python.exe
python = ""
# Dossier temporaire de ComfyUI. Les images StableCraft y sont écrites puis
# supprimées après téléchargement, pour ne pas polluer le dossier output.
# Vide = <root>/ComfyUI/temp
# temp_dir = ""
# Ne pas ouvrir l'UI web de ComfyUI dans le navigateur au démarrage.
# disable_browser = true
# Optionnel, pour l'affichage et la validation.
# models_dir = ""

[models]
# Dossier dédié pour les téléchargements.
# Vide = <dossier StableCraft>/models
store_dir = ""
allow_downloads = true
require_sha256 = true

# ---------------------------------------------------------------------------
# Profils
# ---------------------------------------------------------------------------
# enabled = false désactive le profil côté model manager (pas encore utilisé
# par l'UI). Laisse les chemins commentés si ComfyUI voit déjà les fichiers.

[profiles.flux3_klein]
enabled = true
# unet = "F:/IA/Models IA/Checkpoints/flux-3-image-klein-Q8_0.gguf"
# text_encoder = "F:/.../Qwen-3-VL-4B-Scaled-FP8-v2.safetensors"
# vae = "F:/.../flux2_vae.safetensors"
steps = 16
cfg = 1.0
sampler = "euler"
scheduler = "simple"
context_padding = 96
feather = 10

[profiles.flux2_klein_9b]
enabled = true
# unet = "F:/IA/Models IA/Checkpoints/flux-2-klein-Distilled-9b-Q8_0.gguf"
# text_encoder = "F:/.../Qwen3-8B-Q4_K_M.gguf"
# vae = "F:/.../flux2_vae.safetensors"
steps = 4
cfg = 1.0
sampler = "euler"
scheduler = "simple"
context_padding = 96
feather = 10

[profiles.krea2_edit]
enabled = true
# unet = "F:/IA/Models IA/Checkpoints/krea2_turbo_edit-Q4_K_M.gguf"
# text_encoder = "F:/.../Qwen-3-VL-4B-Scaled-FP8-v2.safetensors"
# vae = "F:/.../qwen_image_vae.safetensors"
steps = 8
cfg = 1.0
sampler = "euler"
scheduler = "simple"
ref_boost = 4.0
grounding_px = 768
context_padding = 96
feather = 10
