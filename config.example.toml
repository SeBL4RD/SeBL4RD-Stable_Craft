# StableCraft — configuration.
#
# Tu n'as normalement rien à modifier ici : double-clique sur StableCraft.bat.
# Le lanceur détecte PhotoCraft et ComfyUI, ou lit les chemins ci-dessous.
# Si un chemin obligatoire manque, il affiche un message clair et s'arrête.
#
# Les chemins de modèles sont OPTIONNELS. Si tu ne les renseignes pas,
# StableCraft utilise ce que ComfyUI voit déjà. Aucun modèle n'est téléchargé
# automatiquement.
#
# Données locales : <dossier StableCraft>/user (sessions, token, journaux)
# Modèles téléchargés : <dossier StableCraft>/models
# Rien n'est écrit dans AppData.

[app]
# "en" (default) or "fr"
language = "en"
theme = "dark"
default_profile = "flux3_klein"
# Vide = <dossier StableCraft>/user/sessions
# Doit rester sous photocraft.automation_root.
# sessions_dir = ""
# Python qui lance l'UI (Tkinter). Vide = le Python qui exécute StableCraft.bat.
# python_ui = "C:/Users/Seb/AppData/Local/Programs/Python/Python311/pythonw.exe"

[photocraft]
# Photocraft.exe. Vide = recherche automatique.
# Linux : /usr/bin/photocraft (paquet Arch), trouvé tout seul dans le PATH.
executable = ""
control_host = "127.0.0.1"
# 7990 évite la plage 7878 souvent exclue par Windows (Hyper-V/WSL).
control_port = 7990
# Vide = <dossier StableCraft>/user/control.token
control_token_file = ""
# Vide = <dossier StableCraft>/user
# Doit être le même dossier que --automation-write-root de PhotoCraft.
automation_root = ""

[comfyui]
# 8188 = port par défaut de ComfyUI. Si ton ComfyUI écoute sur un autre port,
# change endpoint ci-dessous. StableCraft ajoutera automatiquement --port à
# start_command si celui-ci n'en contient pas déjà un.
endpoint = "http://127.0.0.1:8188"
# Dossier ComfyUI portable (celui qui contient run_nvidia_gpu.bat et python_embeded).
# Vide = recherche automatique.
root = ""
# Lanceur ComfyUI. Vide = <root>/run_nvidia_gpu.bat
start_command = ""
# Python embarqué de ComfyUI (Pillow + requests). Vide = <root>/python_embeded/python.exe
python = ""
# Dossier temporaire de ComfyUI. Les images StableCraft y sont écrites puis
# supprimées après téléchargement, pour ne pas polluer le dossier output.
# Vide = <root>/ComfyUI/temp
# temp_dir = ""
# Ne pas ouvrir l'UI web de ComfyUI dans le navigateur au démarrage.
# disable_browser = true
# Linux : root = dossier du checkout git (celui qui contient main.py) ;
# python vide = premier .venv ou venv trouvé à côté de main.py, puis dans root.
# Commande de redémarrage optionnelle (unité systemd, script), utilisée au
# lancement si ComfyUI ne tourne pas, et par « Redémarrer ComfyUI » :
# StableCraft attend la fin de la commande : un code de sortie non nul est
# affiché comme un refus (exemple : file ComfyUI occupée, code 3).
# restart_command = "systemctl --user restart comfyui"
# Optionnel, pour l'affichage et la validation.
# models_dir = ""

[models]
# Dossier dédié pour les téléchargements.
# Vide = <dossier StableCraft>/models
store_dir = ""
allow_downloads = true
require_sha256 = true

# ---------------------------------------------------------------------------
# Profils
# ---------------------------------------------------------------------------
# enabled = false désactive le profil côté model manager (pas encore utilisé
# par l'UI). Laisse les chemins commentés si ComfyUI voit déjà les fichiers.

[profiles.flux3_klein]
enabled = true
# unet = "F:/IA/Models IA/Checkpoints/flux-3-image-klein-Q8_0.gguf"
# text_encoder = "F:/.../Qwen-3-VL-4B-Scaled-FP8-v2.safetensors"
# vae = "F:/.../flux2_vae.safetensors"
steps = 16
cfg = 1.0
sampler = "euler"
scheduler = "simple"
context_padding = 96
feather = 10

[profiles.flux2_klein_9b]
enabled = true
# unet = "F:/IA/Models IA/Checkpoints/flux-2-klein-Distilled-9b-Q8_0.gguf"
# text_encoder = "F:/.../Qwen3-8B-Q4_K_M.gguf"
# vae = "F:/.../flux2_vae.safetensors"
steps = 4
cfg = 1.0
sampler = "euler"
scheduler = "simple"
context_padding = 96
feather = 10

# Base officielle + LoRA General Edit : recommandé pour l'édition générale.
# T2I utilise la base seule, sans le LoRA.
[profiles.krea2_general_edit]
enabled = true
# unet = "F:/.../krea2_turbo_fp8_scaled.safetensors"
# lora = "F:/.../krea2_general_edit_v2.safetensors"
# text_encoder = "F:/.../qwen3vl_4b_fp8_scaled.safetensors"
# vae = "F:/.../qwen_image_vae.safetensors"
steps = 8
cfg = 1.0
sampler = "euler"
scheduler = "simple"
ref_boost = 4.0
grounding_px = 768
lora_strength = 1.0
context_padding = 96
feather = 10

# Fichier fusionné Identity Edit : utile pour les personnages, EDIT expérimental.
[profiles.krea2_edit]
enabled = true
# unet = "F:/IA/Models IA/Checkpoints/krea2_turbo_edit-Q4_K_M.gguf"
# text_encoder = "F:/.../Qwen-3-VL-4B-Scaled-FP8-v2.safetensors"
# vae = "F:/.../qwen_image_vae.safetensors"
steps = 8
cfg = 1.0
sampler = "euler"
scheduler = "simple"
ref_boost = 4.0
grounding_px = 768
context_padding = 96
feather = 10

# Qwen Image 2.1 : T2I et Edit, jusqu'à 10 images de référence.
# Le modèle GGUF ComfyUI-ready (Abiray) existe en Q4_K_M et Q8_0 ; le text encoder
# officiel utilise W4A8 (qwen3vl_8b_w4a8.safetensors, 6,3 Go) ou INT8 (9,35 Go).
# Les GGUF Unsloth n'ont pas la métadonnée d'architecture qwen_image.
[profiles.qwen_image_21]
enabled = true
# unet = "F:/.../qwen_image_2.1_Q4_K_M.gguf"
# text_encoder = "F:/.../qwen3vl_8b_w4a8.safetensors"
# vae = "F:/.../qwen_image_2.1_vae_bf16.safetensors"
steps = 25
cfg = 1.0
sampler = "euler"
scheduler = "simple"
context_padding = 96
feather = 10
